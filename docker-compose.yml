services:
  php:
    build:
      context: ./docker/php
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      # Короткое окно троттлинга входа: e2e-тесты ходят с одного IP и быстро выбирают общий лимит.
      LOGIN_THROTTLE_INTERVAL: "1 minute"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./docker/php
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -v
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      # Короткое окно троттлинга входа: e2e-тесты ходят с одного IP и быстро выбирают общий лимит.
      LOGIN_THROTTLE_INTERVAL: "1 minute"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      API_URL: "http://nginx"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - nginx

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # E2E-тесты (Playwright). Не стартует вместе со стеком: `make e2e` или
  # `docker compose --profile e2e run --rm e2e`.
  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: ["e2e"]
    working_dir: /e2e
    # От uid/gid хоста (Makefile подставляет), чтобы отчёты и скриншоты в ./e2e не оказались root-овыми.
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    shm_size: "1gb"
    command: sh -c "npm install --no-audit --no-fund && npx bddgen && npx playwright test"
    environment:
      E2E_BASE_URL: "http://frontend:5173"
      CI: "1"
      HOME: /tmp
    volumes:
      - ./e2e:/e2e
    depends_on:
      - frontend
      - worker

volumes:
  postgres_data:
  redis_data:
  frontend_modules:
