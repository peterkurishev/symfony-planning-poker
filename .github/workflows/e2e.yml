# E2E-тесты (Playwright + playwright-bdd) на GitHub Actions.
# Поднимает тот же docker-compose-стек, что и локально, применяет миграции и запускает `make e2e`.
name: E2E

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      args:
        description: 'Аргументы playwright test (фильтр), например 08-finish-round или --grep "UC-08"'
        required: false
        default: ''
      screenshots:
        description: 'Скриншот после каждого шага'
        type: boolean
        required: false
        default: false

# Повторный push в ту же ветку/PR отменяет незавершённый прогон.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Имя проекта compose фиксируем: от него зависят имена образов (sfplpk-php, sfplpk-worker),
  # которые собираются ниже с кэшем GitHub Actions.
  COMPOSE_PROJECT_NAME: sfplpk

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Образ php (phpredis собирается из исходников, это несколько минут) — кэшируем слои между прогонами.
      # Тегируем под оба сервиса, чтобы `docker compose up` взял готовый образ и не собирал заново.
      - name: Build php image
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          load: true
          tags: |
            sfplpk-php:latest
            sfplpk-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # vendor/ ставится entrypoint-ом контейнера при старте; кэш по composer.lock экономит минуту.
      # Без restore-keys: частичное совпадение оставило бы устаревший vendor, а entrypoint его не переустановит.
      - name: Cache composer vendor
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}

      - name: Cache e2e node_modules
        uses: actions/cache@v4
        with:
          path: e2e/node_modules
          key: e2e-npm-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Start stack
        run: docker compose up -d

      # `run` ждёт healthy postgres (depends_on) и, через flock в entrypoint, окончания composer install.
      - name: Apply migrations
        run: docker compose run --rm php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run e2e tests
        run: make e2e ARGS='${{ github.event.inputs.args }}' SCREENSHOTS=${{ github.event.inputs.screenshots == 'true' && '1' || '0' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --timestamps
